<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mistrail — Plan your trip</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #faf9f5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #__bundler_loading {
        position: fixed;
        bottom: 20px;
        right: 20px;
        font:
          13px/1.4 -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: #666;
        background: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        z-index: 10000;
      }
      #__bundler_thumbnail {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf9f5;
        z-index: 9999;
      }
      #__bundler_thumbnail svg {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #__bundler_placeholder {
        color: #999;
        font-size: 14px;
      }
    </style>

      <style>
        #__bundler_loading {
          display: none;
        }
      </style>

  <body>
    <div id="__bundler_placeholder">Loading Mistrail — Plan your trip...</div>
    <div id="__bundler_loading">Unpacking...</div>

    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        const loading = document.getElementById("__bundler_loading");
        function setStatus(msg) {
          if (loading) loading.textContent = msg;
        }

        const FONT_MIME =
          /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
        const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
        function toBase64(bytes) {
          let bin = "";
          for (let i = 0; i < bytes.length; i += 0x8000) {
            bin += String.fromCharCode.apply(
              null,
              bytes.subarray(i, i + 0x8000),
            );
          }
          return btoa(bin);
        }

        // Error sink persists across replaceWith since it's on window, not the DOM.
        window.addEventListener(
          "error",
          function (e) {
            // Failed resource loads (CSP-blocked links, scripts, images) fire plain
            // events at the element — warn only; real JS errors carry message/error.
            if (!e.message && !e.error && e.target && e.target !== window) {
              console.warn(
                "[bundle] resource failed to load:",
                e.target.tagName,
                String(e.target.src || e.target.href || ""),
              );
              return;
            }
            var p = document.body || document.documentElement;
            var d =
              document.getElementById("__bundler_err") ||
              p.appendChild(document.createElement("div"));
            d.id = "__bundler_err";
            d.style.cssText =
              "position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto";
            d.textContent =
              (d.textContent ? d.textContent + String.fromCharCode(10) : "") +
              "[bundle] " +
              (e.message || e.type) +
              (e.filename
                ? " (" + e.filename.slice(0, 60) + ":" + e.lineno + ")"
                : "");
          },
          true,
        );

        try {
          const manifestEl = document.querySelector(
            'script[type="__bundler/manifest"]',
          );
          const templateEl = document.querySelector(
            'script[type="__bundler/template"]',
          );
          if (!manifestEl || !templateEl) {
            setStatus("Error: missing bundle data");
            console.error(
              "[bundler] Missing script tags — manifestEl:",
              !!manifestEl,
              "templateEl:",
              !!templateEl,
            );
            return;
          }

          const manifest = JSON.parse(manifestEl.textContent);
          let template = JSON.parse(templateEl.textContent);

          // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
          // document's manifest; frame srcs carry an about:blank#<uuid> marker
          // instead of a substitutable uuid. Every document mints the blobs for
          // its OWN frames — from local text at the root, or text obtained from
          // its DIRECT parent over the relay protocol below — so each frame
          // navigation stays same-origin with its initiator and a deduped page
          // loads at any depth on any host, including a file:// download's
          // opaque origins (where a blob minted by one document cannot be
          // navigated to by another).
          const pageOrderEl = document.querySelector(
            'script[type="__bundler/page_order"]',
          );
          const pageOrder = pageOrderEl
            ? JSON.parse(pageOrderEl.textContent)
            : [];
          const pageSet = new Set(pageOrder);
          const pageTexts = {};

          // ── Nested-page text protocol (parent-chain relay) ──
          // Page bundles ship once, in the ROOT document's manifest. Every
          // document mints the blobs for its OWN frames, obtaining page text
          // through a strict parent-chain relay: a document only ever SENDS to
          // its direct parent (which, for every document the publisher's own
          // runtime minted, is another publisher document) and only ACCEPTS
          // text from that direct parent; requests from below are honored only
          // for the document's own child frames, and the ROOT never sends
          // upward at all. That last rule is load-bearing: the artifact host's
          // frame-ancestors allows claude.ai (and friends) to frame an
          // artifact, so window.top can be a FOREIGN document — a top-addressed
          // protocol would hand page uuids to that ancestor and accept forged
          // "page text" from it, minting attacker HTML as an artifact-origin
          // blob document. The chain never touches the ancestor: requests stop
          // at the root, replies are origin-addressed per hop (never '*' when
          // an origin exists), and both directions are origin-gated (on https
          // a foreign sender's origin can never equal this document's; in
          // opaque contexts — file:// — everything serializes as 'null', where
          // an embedded EXTERNAL frame still fails the gate by carrying its
          // own real origin, and a sandboxed child of such a frame is excluded
          // by the own-child-frames check plus uuid unguessability). Shape is
          // deny-by-default: one request form, one reply form, no error
          // replies.
          // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
          // contexts such as a sandboxed preview iframe) — location.origin is
          // computed from the URL and stays 'https://…' even when the document
          // is sandboxed, which would misgate every opaque chain.
          const OWN_TARGET = /^https?:[/][/]/.test(window.origin || "")
            ? window.origin
            : "*";
          function trustedOrigin(e) {
            if (e.origin === window.origin) return true; // https chains; opaque==opaque
            // file:// trees: Chrome serializes the file document's origin as
            // 'file://' while the blob: documents it mints serialize as 'null',
            // so the two legitimate shapes can never string-match — accept the
            // pair in both directions. https origins never serialize as either,
            // and sender identity (own child frame / direct parent) is checked
            // separately.
            return (
              (e.origin === "null" &&
                (window.origin === "file://" ||
                  window.location.protocol === "file:")) ||
              (/^file:/.test(e.origin) && window.origin === "null")
            );
          }
          // Non-empty only in the root document (nested bundles ship an empty
          // island), so it doubles as the root marker: the root answers from
          // local text and treats a miss as authoritative — never relaying to
          // its (possibly foreign) parent.
          const isPageRoot = pageOrder.length > 0;
          const blobUrls = {};
          const resourceBlobs = {};
          const UUID_SHAPE =
            /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
          const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
          const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
          function mountPage(el, frag, text) {
            const pageBlob = new Blob([text], { type: "text/html" });
            const u = URL.createObjectURL(pageBlob);
            resourceBlobs[u] = pageBlob;
            el.src = u + frag;
          }
          function deliverPage(uuid, text) {
            const frames = pendingFrames[uuid];
            delete pendingFrames[uuid];
            if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
            const relays = pendingRelays[uuid];
            delete pendingRelays[uuid];
            if (relays) {
              for (const cw of relays) {
                try {
                  cw.postMessage(
                    { __bundler_page: uuid, __bundler_text: text },
                    OWN_TARGET,
                  );
                } catch (err) {
                  /* gone */
                }
              }
            }
          }
          function ownFrameWindows() {
            const out = [];
            for (const f of Array.from(document.querySelectorAll("iframe"))) {
              try {
                if (f.contentWindow) out.push(f.contentWindow);
              } catch (err) {
                /* detached */
              }
            }
            return out;
          }
          window.addEventListener("message", function (e) {
            const d = e.data;
            if (!d || typeof d !== "object" || !e.source) return;
            // Origin gate first; the structural checks below (own-child-frames
            // for requests, direct-parent + solicited-uuid for replies, the
            // root's never-relay rule) are what hold in fully opaque chains
            // where origin strings can't discriminate — a sandboxed root's
            // FOREIGN wrapper still fails all three even though both serialize
            // as real-vs-'null' rather than matching.
            if (!trustedOrigin(e)) return;
            if (
              typeof d.__bundler_need === "string" &&
              UUID_SHAPE.test(d.__bundler_need)
            ) {
              // Requests are honored only for this document's own child frames.
              if (ownFrameWindows().indexOf(e.source) < 0) return;
              const uuid = d.__bundler_need;
              const text = pageTexts[uuid];
              if (typeof text === "string") {
                try {
                  e.source.postMessage(
                    { __bundler_page: uuid, __bundler_text: text },
                    OWN_TARGET,
                  );
                } catch (err) {
                  /* gone */
                }
                return;
              }
              if (isPageRoot || window.parent === window) return; // authoritative miss
              const waiting = pendingRelays[uuid];
              if (waiting) {
                if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
                return;
              }
              // Never-answered uuids would otherwise accumulate forever under a
              // request spray; past the cap (far above any real page count) new
              // relays are dropped rather than remembered.
              if (Object.keys(pendingRelays).length >= 128) return;
              pendingRelays[uuid] = [e.source];
              window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
            } else if (
              typeof d.__bundler_page === "string" &&
              UUID_SHAPE.test(d.__bundler_page) &&
              typeof d.__bundler_text === "string"
            ) {
              // The shape test is load-bearing beyond tidiness: the solicited
              // check below uses the in operator, which matches prototype keys
              // ('__proto__', 'constructor') — an unshaped key would reach
              // deliverPage and throw, painting the error banner.
              // Text is accepted only from the direct parent — the document
              // that minted this one.
              if (e.source !== window.parent || window.parent === window)
                return;
              if (
                !(d.__bundler_page in pendingFrames) &&
                !(d.__bundler_page in pendingRelays)
              )
                return;
              deliverPage(d.__bundler_page, d.__bundler_text);
            }
          });

          const uuids = Object.keys(manifest);
          setStatus("Unpacking " + uuids.length + " assets...");

          await Promise.all(
            uuids.map(async (uuid) => {
              const entry = manifest[uuid];
              try {
                const binaryStr = atob(entry.data);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++)
                  bytes[i] = binaryStr.charCodeAt(i);

                let finalBytes = bytes;
                if (entry.compressed) {
                  if (typeof DecompressionStream !== "undefined") {
                    const ds = new DecompressionStream("gzip");
                    const writer = ds.writable.getWriter();
                    const reader = ds.readable.getReader();
                    writer.write(bytes);
                    writer.close();
                    const chunks = [];
                    let totalLen = 0;
                    while (true) {
                      const { done, value } = await reader.read();
                      if (done) break;
                      chunks.push(value);
                      totalLen += value.length;
                    }
                    finalBytes = new Uint8Array(totalLen);
                    let offset = 0;
                    for (const chunk of chunks) {
                      finalBytes.set(chunk, offset);
                      offset += chunk.length;
                    }
                  } else {
                    console.warn(
                      "DecompressionStream not available, asset " +
                        uuid +
                        " may not render",
                    );
                  }
                }

                if (pageSet.has(uuid)) {
                  pageTexts[uuid] = new TextDecoder().decode(finalBytes);
                  return;
                }
                if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
                  // Strict artifact hosts allow font-src data: but not blob:.
                  blobUrls[uuid] =
                    "data:" +
                    entry.mime +
                    ";base64," +
                    (entry.compressed ? toBase64(finalBytes) : entry.data);
                } else {
                  const blob = new Blob([finalBytes], { type: entry.mime });
                  blobUrls[uuid] = URL.createObjectURL(blob);
                  resourceBlobs[blobUrls[uuid]] = blob;
                }
              } catch (err) {
                console.error("Failed to decode asset " + uuid + ":", err);
                const blob = new Blob([], { type: entry.mime });
                blobUrls[uuid] = URL.createObjectURL(blob);
                resourceBlobs[blobUrls[uuid]] = blob;
              }
            }),
          );

          const extResEl = document.querySelector(
            'script[type="__bundler/ext_resources"]',
          );
          const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
          const resourceMap = {};
          for (const entry of extResources) {
            if (blobUrls[entry.uuid])
              resourceMap[entry.id] = blobUrls[entry.uuid];
          }

          // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
          // consumers read these Blobs directly. Survives the swap like the error sink.
          window.__resourceBlobs = resourceBlobs;

          setStatus("Rendering...");
          // Page uuids have no blob here — they ride inside about:blank#<uuid>
          // frame markers the pass below resolves after the swap.
          for (const uuid of uuids) {
            if (pageSet.has(uuid)) continue;
            template = template.split(uuid).join(blobUrls[uuid]);
          }

          // Strip integrity + crossorigin — blob URLs from a file:// document inherit
          // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
          // The manifest bytes are ours; SRI protects against CDN compromise, not this.
          // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
          // bundler left live-fetched (an absolute x-import, a runtime dependency it
          // could not embed, an authored external script) keeps the pin it was
          // written with: that fetch is exactly what SRI protects. (A crossorigin
          // on a parent whose child carries the blob — <video crossorigin><source>
          // — is left alone too; the attribute is then the author's to drop.)
          template = template.replace(/<[a-z][^>]*>/gi, (tag) =>
            /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag)
              ? tag
                  .replace(/\s+integrity="[^"]*"/gi, "")
                  .replace(/\s+crossorigin="[^"]*"/gi, "")
              : tag,
          );

          const resourceScript =
            "<script>window.__resources = " +
            JSON.stringify(resourceMap).replace(/<\//g, "<\\/") +
            ";</" +
            "script>";
          // Inject after <head> so the DOCTYPE stays first; prepending the script
          // would push the parser into quirks mode. DOMParser always emits a <head>
          // (synthesizing one if the source HTML omitted it) but may carry
          // attributes through, so match the full opening tag. slice() rather than
          // replace() keeps us clear of $-pattern substitution in resourceScript.
          const headOpen = template.match(/<head[^>]*>/i);
          if (headOpen) {
            const i = headOpen.index + headOpen[0].length;
            template =
              template.slice(0, i) + resourceScript + template.slice(i);
          }

          // Parse the template and swap the root element. Scripts inserted via
          // DOMParser/replaceWith are inert per spec — re-create each with
          // createElement so they execute, awaiting onload for src scripts to
          // preserve ordering (React before ReactDOM before Babel before text/babel).
          const doc = new DOMParser().parseFromString(template, "text/html");
          document.documentElement.replaceWith(doc.documentElement);

          // Resolve page-frame markers: mint this document's own blob for each
          // framed page — from local text when this is the root, otherwise by
          // asking the direct parent over the relay protocol above. An
          // unanswered request leaves the frame on about:blank, the same
          // degraded state as a refused embed.
          {
            const MARKER =
              /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
            const needed = [];
            for (const el of Array.from(document.querySelectorAll("iframe"))) {
              const m = MARKER.exec(el.getAttribute("src") || "");
              if (!m) continue;
              const text = pageTexts[m[1]];
              if (typeof text === "string") {
                mountPage(el, m[2] || "", text);
              } else if (window.parent !== window && !isPageRoot) {
                const had = pendingFrames[m[1]];
                (pendingFrames[m[1]] = had || []).push({
                  el: el,
                  frag: m[2] || "",
                });
                if (!had) needed.push(m[1]);
              }
            }
            for (const uuid of needed) {
              window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
            }
          }

          const dead = Array.from(document.scripts);
          for (const old of dead) {
            const s = document.createElement("script");
            for (const a of old.attributes) s.setAttribute(a.name, a.value);
            s.textContent = old.textContent;
            // text/babel scripts with a src: read and inline. transformScriptTags
            // does XHR against the src, but blob:null/ from a file:// origin is
            // silently dropped. Inlining makes it a plain inline babel script,
            // which transformScriptTags handles unconditionally.
            if ((s.type === "text/babel" || s.type === "text/jsx") && s.src) {
              const pre = resourceBlobs[s.src.split("#")[0]];
              s.textContent = pre
                ? await pre.text()
                : await (await fetch(s.src)).text();
              s.removeAttribute("src");
            }
            const p = s.src
              ? new Promise(function (r) {
                  s.onload = s.onerror = r;
                })
              : null;
            old.replaceWith(s);
            if (p) await p;
          }
          // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
          // which fired before we swapped the document. Trigger manually if present.
          if (
            window.Babel &&
            typeof window.Babel.transformScriptTags === "function"
          ) {
            window.Babel.transformScriptTags();
          }
        } catch (err) {
          setStatus("Error unpacking: " + err.message);
          console.error("Bundle unpack error:", err);
        }
      });
    </script>

252-43c9-9c84-9d1d4a0f25e5\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#F6F8F7}\na{color:#2E4A50}a:hover{color:#B5462E}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font-family: Manrope, sans-serif; color: #17221C; background: #F6F8F7\" data-canvas-width=\"1440\" data-canvas-height=\"3300\" data-document-role=\"page\" data-label=\"09 Plan Your Trip · Permits &amp; costs\">\n  <dc-import name=\"Header\" active=\"plan\" hint-size=\"100%,77px\"><\u002Fdc-import>\n\n  <div role=\"status\" style=\"background: #F7EBD9; border-bottom: 1px solid #EAD7B8\">\n    <div style=\"max-width: 1320px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px; color: #5A3A10\">\n      <strong style=\"padding: 4px 10px; border-radius: 999px; background: #C9781B; color: #FFFFFF; font-size: 12px\">TRAVEL ALERT<\u002Fstrong>\n      <span>[Live alert text — e.g. road closure or permit suspension, with date]<\u002Fspan>\n      <a href=\"#\" style=\"margin-left: auto; color: #5A3A10; font-weight: 800\">All alerts →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <main style=\"max-width: 1320px; margin: 0 auto; padding: 48px 24px 96px; display: flex; flex-direction: column; gap: 72px\">\n    <section style=\"display: flex; flex-direction: column; gap: 16px; max-width: 900px\">\n      <span style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.18em; color: #B5462E\">PLAN YOUR TRIP<\u002Fspan>\n      <h1 style=\"margin: 0; font-size: 76px; font-weight: 800; letter-spacing: -0.035em; line-height: 1\">Permits, seasons, <span style=\"font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; color: #B5462E\">sorted.<\u002Fspan><\u002Fh1>\n      <p style=\"margin: 0; font-size: 19px; line-height: 1.6; color: #3A4A42\">Everything you need to know before you go. Book any Mistrail package and we apply for your permits for you.<\u002Fp>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; font-weight: 700\">\n        <a href=\"#permits\" style=\"padding: 10px 16px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DCE3E0; text-decoration: none; color: #17221C\">Permit checker<\u002Fa>\n        <a href=\"#budget\" style=\"padding: 10px 16px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DCE3E0; text-decoration: none; color: #17221C\">Cost calculator<\u002Fa>\n        <a href=\"#season\" style=\"padding: 10px 16px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DCE3E0; text-decoration: none; color: #17221C\">Best time to visit<\u002Fa>\n        <a href=\"#reach\" style=\"padding: 10px 16px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DCE3E0; text-decoration: none; color: #17221C\">Getting there<\u002Fa>\n        <a href=\"#essentials\" style=\"padding: 10px 16px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DCE3E0; text-decoration: none; color: #17221C\">Essentials &amp; packing<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"permits\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 24px; align-items: start\">\n      <div style=\"padding: 32px; border-radius: 28px; background: #FFFFFF; border: 1px solid #E3E9E6; display: flex; flex-direction: column; gap: 24px\">\n        <h2 style=\"margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em\">Do I need a permit?<\u002Fh2>\n        <div style=\"display: flex; flex-direction: column; gap: 10px\">\n          <span style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.12em; color: #4A5A50\">1 · I AM<\u002Fspan>\n          <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n            <button sc-camel-on-click=\"{{setIndian}}\" aria-pressed=\"{{indianOn}}\" style=\"{{indianStyle}}\">An Indian citizen<\u002Fbutton>\n            <button sc-camel-on-click=\"{{setForeign}}\" aria-pressed=\"{{foreignOn}}\" style=\"{{foreignStyle}}\">A foreign national<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px\">\n          <span style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.12em; color: #4A5A50\">2 · I WANT TO VISIT<\u002Fspan>\n          <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n            <sc-for list=\"{{chips}}\" as=\"c\" hint-placeholder-count=\"8\">\n              <button sc-camel-on-click=\"{{c.toggle}}\" aria-pressed=\"{{c.on}}\" style=\"{{c.style}}\">{{c.name}}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 32px; border-radius: 28px; background: #2E4A50; color: #FFFFFF; display: flex; flex-direction: column; gap: 16px\">\n        <span style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.14em; color: #F3C9B4\">YOUR PERMITS<\u002Fspan>\n        <sc-for list=\"{{results}}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div style=\"display: flex; gap: 14px; padding: 16px; border-radius: 16px; background: rgba(255,255,255,0.08)\">\n            <span style=\"{{r.badge}}\">{{r.tag}}<\u002Fspan>\n            <div style=\"display: flex; flex-direction: column; gap: 4px\"><strong style=\"font-size: 17px\">{{r.state}}<\u002Fstrong><span style=\"font-size: 14px; color: #CFDBD6; line-height: 1.5\">{{r.text}}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{none}}\" hint-placeholder-val=\"{{false}}\">\n          <span style=\"color: #CFDBD6\">Pick at least one state.<\u002Fspan>\n        <\u002Fsc-if>\n        <a href=\"Packages.dc.html\" style=\"margin-top: 8px; display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 999px; background: #FFFFFF; color: #17221C; font-weight: 800; text-decoration: none\">Book a trip — we handle permits<\u002Fa>\n        <span style=\"font-size: 12px; color: #A9BDB5\">Rules change often. Last checked: [date]. Always confirm on the official state portal.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"budget\" style=\"display: flex; flex-direction: column; gap: 20px\">\n      <div style=\"display: flex; flex-direction: column; gap: 8px\">\n        <h2 style=\"margin: 0; font-size: 44px; font-weight: 800; letter-spacing: -0.03em\">What will my trip <span style=\"font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; color: #B5462E\">cost?<\u002Fspan><\u002Fh2>\n        <span style=\"font-size: 17px; color: #3A4A42\">A quick estimate before you talk to us. Change anything and the total updates.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch\">\n        <div style=\"flex: 999 1 520px; min-width: 0; padding: 32px; border-radius: 28px; background: #FFFFFF; border: 1px solid #E3E9E6; display: flex; flex-direction: column; gap: 28px\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n            <div style=\"flex: 1 1 220px; display: flex; flex-direction: column; gap: 10px\">\n              <span style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.12em; color: #4A5A50\">TRIP LENGTH<\u002Fspan>\n              <div style=\"display: flex; align-items: center; gap: 12px\">\n                <button sc-camel-on-click=\"{{daysDown}}\" aria-label=\"Fewer days\" style=\"width: 48px; height: 48px; border-radius: 999px; border: 1px solid #DCE3E0; background: #F6F8F7; font: inherit; font-size: 22px; font-weight: 800; cursor: pointer\">−<\u002Fbutton>\n                <strong style=\"min-width: 96px; text-align: center; font-size: 24px\">{{days}} days<\u002Fstrong>\n                <button sc-camel-on-click=\"{{daysUp}}\" aria-label=\"More days\" style=\"width: 48px; height: 48px; border-radius: 999px; border: 1px solid #DCE3E0; background: #F6F8F7; font: inherit; font-size: 22px; font-weight: 800; cursor: pointer\">+<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex: 1 1 220px; display: flex; flex-direction: column; gap: 10px\">\n              <span style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.12em; color: #4A5A50\">TRAVELLERS<\u002Fspan>\n              <div style=\"display: flex; align-items: center; gap: 12px\">\n                <button sc-camel-on-click=\"{{paxDown}}\" aria-label=\"Fewer travellers\" style=\"width: 48px; height: 48px; border-radius: 999px; border: 1px solid #DCE3E0; background: #F6F8F7; font: inherit; font-size: 22px; font-weight: 800; cursor: pointer\">−<\u002Fbutton>\n                <strong style=\"min-width: 96px; text-align: center; font-size: 24px\">{{paxLabel}}<\u002Fstrong>\n                <button sc-camel-on-click=\"{{paxUp}}\" aria-label=\"More travellers\" style=\"width: 48px; height: 48px; border-radius: 999px; border: 1px solid #DCE3E0; background: #F6F8F7; font: inherit; font-size: 22px; font-weight: 800; cursor: pointer\">+<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 10px\">\n            <span style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.12em; color: #4A5A50\">WHERE YOU STAY<\u002Fspan>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px\">\n              <sc-for list=\"{{stays}}\" as=\"s\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{s.pick}}\" aria-pressed=\"{{s.on}}\" style=\"{{s.style}}\"><strong style=\"display: block; font-size: 16px\">{{s.name}}<\u002Fstrong><span style=\"font-size: 13px; color: #4A5A50\">{{s.rate}}<\u002Fspan><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 10px\">\n            <span style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.12em; color: #4A5A50\">GETTING AROUND<\u002Fspan>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px\">\n              <sc-for list=\"{{rides}}\" as=\"r\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{r.pick}}\" aria-pressed=\"{{r.on}}\" style=\"{{r.style}}\"><strong style=\"display: block; font-size: 16px\">{{r.name}}<\u002Fstrong><span style=\"font-size: 13px; color: #4A5A50\">{{r.rate}}<\u002Fspan><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n            <button sc-camel-on-click=\"{{toggleSafari}}\" aria-pressed=\"{{safariOn}}\" style=\"{{safariStyle}}\">Kaziranga jeep safari · ₹2,200 pp<\u002Fbutton>\n            <button sc-camel-on-click=\"{{toggleIlp}}\" aria-pressed=\"{{ilpOn}}\" style=\"{{ilpStyle}}\">Permit (ILP) fees · ₹300 pp<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 340px; padding: 32px; border-radius: 28px; background: #17221C; color: #FFFFFF; display: flex; flex-direction: column; gap: 18px\">\n          <span style=\"font-size: 13px; font-weight: 800; letter-spacing: 0.14em; color: #E9A07F\">ESTIMATED TOTAL<\u002Fspan>\n          <strong style=\"font-size: 56px; letter-spacing: -0.03em; line-height: 1\">₹{{total}}<\u002Fstrong>\n          <span style=\"font-size: 15px; color: #A9B6AF\">about ₹{{perPax}} per person<\u002Fspan>\n          <div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 1px solid #33423A; font-size: 15px\">\n            <span style=\"display: flex; justify-content: space-between\"><span style=\"color: #CFDBD6\">Stays ({{days}} nights, twin share)<\u002Fspan><strong>₹{{stayCost}}<\u002Fstrong><\u002Fspan>\n            <span style=\"display: flex; justify-content: space-between\"><span style=\"color: #CFDBD6\">Transport<\u002Fspan><strong>₹{{rideCost}}<\u002Fstrong><\u002Fspan>\n            <span style=\"display: flex; justify-content: space-between\"><span style=\"color: #CFDBD6\">Food (₹800 pp / day)<\u002Fspan><strong>₹{{foodCost}}<\u002Fstrong><\u002Fspan>\n            <span style=\"display: flex; justify-content: space-between\"><span style=\"color: #CFDBD6\">Safari &amp; permits<\u002Fspan><strong>₹{{extraCost}}<\u002Fstrong><\u002Fspan>\n          <\u002Fdiv>\n          <a href=\"Planner.dc.html\" style=\"margin-top: auto; display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 999px; background: #E9A07F; color: #17221C; font-weight: 800; text-decoration: none\">Turn this into a trip plan<\u002Fa>\n          <span style=\"font-size: 12px; color: #8E9C95\">Indicative rates, excluding flights. Your final quote may differ.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"season\" style=\"display: flex; flex-direction: column; gap: 20px\">\n      <h2 style=\"margin: 0; font-size: 44px; font-weight: 800; letter-spacing: -0.03em\">Best time to <span style=\"font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; color: #B5462E\">visit<\u002Fspan><\u002Fh2>\n      <div style=\"overflow-x: auto; border-radius: 24px; background: #FFFFFF; border: 1px solid #E3E9E6; padding: 20px\">\n        <div style=\"min-width: 840px; display: grid; grid-template-columns: 170px repeat(12, minmax(0, 1fr)); gap: 4px; font-size: 13px; font-weight: 800\">\n          <span><\u002Fspan>\n          <sc-for list=\"{{monthLabels}}\" as=\"m\" hint-placeholder-count=\"12\"><span style=\"text-align: center; color: #4A5A50; padding-bottom: 6px\">{{m}}<\u002Fspan><\u002Fsc-for>\n          <sc-for list=\"{{heat}}\" as=\"h\" hint-placeholder-count=\"8\">\n            <span style=\"padding: 10px 0\">{{h.name}}<\u002Fspan>\n            <sc-for list=\"{{h.cells}}\" as=\"cell\" hint-placeholder-count=\"12\"><span style=\"{{cell}}\"><\u002Fspan><\u002Fsc-for>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px; font-size: 13px; font-weight: 700; color: #3A4A42\">\n          <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 14px; height: 14px; border-radius: 4px; background: #2F6B5E\"><\u002Fspan>Best<\u002Fspan>\n          <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 14px; height: 14px; border-radius: 4px; background: #9DB8AE\"><\u002Fspan>Good<\u002Fspan>\n          <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 14px; height: 14px; border-radius: 4px; background: #E3B7A6\"><\u002Fspan>Monsoon / avoid<\u002Fspan>\n          <span style=\"color: #6E7C75\">Indicative — verify per route.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"reach\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px\">\n      <div style=\"grid-column: 1 / -1\"><h2 style=\"margin: 0; font-size: 44px; font-weight: 800; letter-spacing: -0.03em\">Getting there &amp; around<\u002Fh2><\u002Fdiv>\n      <div style=\"padding: 24px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E3E9E6; display: flex; flex-direction: column; gap: 8px\"><strong style=\"font-size: 19px\">Fly into Guwahati<\u002Fstrong><span style=\"color: #3A4A42; line-height: 1.55\">The main gateway, linked by air and rail to major Indian cities. Other airports: Bagdogra (Sikkim), Dimapur, Imphal, Agartala, Shillong.<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 24px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E3E9E6; display: flex; flex-direction: column; gap: 8px\"><strong style=\"font-size: 19px\">Private cab or shared taxi<\u002Fstrong><span style=\"color: #3A4A42; line-height: 1.55\">Hill roads are slow. Plan fewer places per day — our planner shows real drive times.<\u002Fspan><\u002Fdiv>\n      <div style=\"padding: 24px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E3E9E6; display: flex; flex-direction: column; gap: 8px\"><strong style=\"font-size: 19px\">Helicopter services<\u002Fstrong><span style=\"color: #3A4A42; line-height: 1.55\">Some routes (e.g. to Tawang) have limited helicopter services — weather dependent. [Verify routes]<\u002Fspan><\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"essentials\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px\">\n      <div style=\"grid-column: 1 / -1\"><h2 style=\"margin: 0; font-size: 44px; font-weight: 800; letter-spacing: -0.03em\">Essentials<\u002Fh2><\u002Fdiv>\n      <sc-for list=\"{{ess}}\" as=\"e\" hint-placeholder-count=\"6\">\n        <div style=\"padding: 22px; border-radius: 20px; background: #E6EEF0; display: flex; flex-direction: column; gap: 6px\"><strong style=\"font-size: 17px\">{{e.t}}<\u002Fstrong><span style=\"font-size: 15px; color: #3A4A42; line-height: 1.55\">{{e.d}}<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n  <\u002Fmain>\n  <dc-import name=\"Footer\" hint-size=\"100%,460px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:2500}}\">\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { foreign: false, picked: { Meghalaya: true, 'Arunachal Pradesh': true }, days: 6, pax: 2, stay: 'homestay', ride: 'suv', safari: true, ilp: true }; }\n  budgetVals() {\n    const S = this.state;\n    const inr = (n) => n.toLocaleString('en-IN');\n    const stayRates = { homestay: 2200, hotel: 4500, heritage: 8500 };\n    const rideRates = { suv: 3500, sedan: 2500, shared: 900 };\n    const stayCost = S.days * stayRates[S.stay] * Math.ceil(S.pax / 2);\n    const rideCost = S.days * rideRates[S.ride];\n    const foodCost = S.days * S.pax * 800;\n    const extraCost = (S.safari ? 2200 * S.pax : 0) + (S.ilp ? 300 * S.pax : 0);\n    const total = stayCost + rideCost + foodCost + extraCost;\n    const card = (on) => 'text-align: left; padding: 14px 16px; border-radius: 16px; font: inherit; color: #17221C; cursor: pointer; min-height: 64px; ' + (on ? 'border: 2px solid #2E4A50; background: #E6EEF0;' : 'border: 1px solid #DCE3E0; background: #FFFFFF;');\n    const pill = (on) => 'height: 46px; padding: 0 18px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; ' + (on ? 'border: none; background: #2E4A50; color: #FFFFFF;' : 'border: 1px solid #DCE3E0; background: #FFFFFF; color: #3A4A42;');\n    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));\n    return {\n      days: S.days, paxLabel: S.pax + (S.pax === 1 ? ' adult' : ' adults'),\n      daysDown: () => this.setState({ days: clamp(S.days - 1, 3, 15) }),\n      daysUp: () => this.setState({ days: clamp(S.days + 1, 3, 15) }),\n      paxDown: () => this.setState({ pax: clamp(S.pax - 1, 1, 10) }),\n      paxUp: () => this.setState({ pax: clamp(S.pax + 1, 1, 10) }),\n      stays: [['homestay', 'Homestay', '~₹2,200 / night'], ['hotel', '3-star / eco-resort', '~₹4,500 / night'], ['heritage', 'Heritage bungalow', '~₹8,500 / night']].map(([id, name, rate]) => ({ name, rate, on: S.stay === id ? 'true' : 'false', style: card(S.stay === id), pick: () => this.setState({ stay: id }) })),\n      rides: [['suv', 'Private SUV', 'Best for hills · ₹3,500 / day'], ['sedan', 'Private sedan', 'Plains · ₹2,500 / day'], ['shared', 'Shared Sumo / bus', 'Budget · ₹900 / day']].map(([id, name, rate]) => ({ name, rate, on: S.ride === id ? 'true' : 'false', style: card(S.ride === id), pick: () => this.setState({ ride: id }) })),\n      safariOn: S.safari ? 'true' : 'false', safariStyle: pill(S.safari), toggleSafari: () => this.setState({ safari: !S.safari }),\n      ilpOn: S.ilp ? 'true' : 'false', ilpStyle: pill(S.ilp), toggleIlp: () => this.setState({ ilp: !S.ilp }),\n      total: inr(total), perPax: inr(Math.round(total / S.pax)),\n      stayCost: inr(stayCost), rideCost: inr(rideCost), foodCost: inr(foodCost), extraCost: inr(extraCost)\n    };\n  }\n  renderVals() {\n    return { ...this.planVals(), ...this.budgetVals() };\n  }\n  planVals() {\n    const states = ['Assam','Meghalaya','Arunachal Pradesh','Nagaland','Manipur','Mizoram','Tripura','Sikkim'];\n    const F = this.state.foreign;\n    const rule = (s) => {\n      const IN = {\n        'Arunachal Pradesh': ['ILP', 'Inner Line Permit required. Apply online through the state e-ILP portal before travel.'],\n        'Nagaland': ['ILP', 'Inner Line Permit required. Available online for domestic tourists.'],\n        'Manipur': ['ILP', 'Inner Line Permit required for non-residents.'],\n        'Mizoram': ['ILP', 'Inner Line Permit required. Check current rules before travel.'],\n        'Sikkim': ['AREA', 'No entry permit, but protected areas (North Sikkim, Tsomgo, Nathula) need area permits via a registered operator.']\n      };\n      const FX = {\n        'Arunachal Pradesh': ['PAP', 'Protected Area Permit required for foreign nationals.'],\n        'Sikkim': ['RAP', 'Restricted Area Permit, booked through a Sikkim-registered agent; groups of two or more for protected areas.'],\n        'Nagaland': ['CHECK', 'Rules for foreign nationals change — we confirm registration requirements for your dates.'],\n        'Manipur': ['CHECK', 'Rules for foreign nationals change — we confirm registration requirements for your dates.'],\n        'Mizoram': ['CHECK', 'Rules for foreign nationals change — we confirm registration requirements for your dates.']\n      };\n      const hit = (F ? FX : IN)[s];\n      return hit ? hit : ['NONE', 'No permit needed.'];\n    };\n    const picked = this.state.picked;\n    const results = states.filter(s => picked[s]).map(s => {\n      const [tag, text] = rule(s);\n      const bg = tag === 'NONE' ? '#2F6B5E' : (tag === 'CHECK' || tag === 'AREA' ? '#C9781B' : '#B5462E');\n      return { state: s, tag, text, badge: 'flex-shrink: 0; align-self: flex-start; padding: 6px 10px; border-radius: 10px; background: ' + bg + '; font-size: 12px; font-weight: 800' };\n    });\n    const btn = (on) => 'height: 48px; padding: 0 20px; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; ' + (on ? 'border: none; background: #17221C; color: #FFFFFF;' : 'border: 1px solid #DCE3E0; background: #FFFFFF; color: #17221C;');\n    const lv = { b: '#2F6B5E', g: '#9DB8AE', m: '#E3B7A6' };\n    const rows = [\n      ['Assam',      'bbbggmmmgbbb'],\n      ['Meghalaya',  'bbbggmmmgbbb'],\n      ['Arunachal',  'ggbbgmmmgbbg'],\n      ['Nagaland',   'bbbbgmmmgbbb'],\n      ['Manipur',    'bbbggmmmgbbb'],\n      ['Mizoram',    'bbbggmmmgbbb'],\n      ['Tripura',    'bbbggmmmgbbb'],\n      ['Sikkim',     'ggbbbmmmgbbg']\n    ];\n    return {\n      indianOn: F ? 'false' : 'true', foreignOn: F ? 'true' : 'false',\n      indianStyle: btn(!F), foreignStyle: btn(F),\n      setIndian: () => this.setState({ foreign: false }),\n      setForeign: () => this.setState({ foreign: true }),\n      chips: states.map(s => ({\n        name: s, on: picked[s] ? 'true' : 'false',\n        toggle: () => this.setState({ picked: { ...picked, [s]: !picked[s] } }),\n        style: 'height: 44px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; ' + (picked[s] ? 'border: 1.5px solid #2E4A50; background: #E6EEF0; color: #2E4A50;' : 'border: 1px solid #DCE3E0; background: #FFFFFF; color: #3A4A42;')\n      })),\n      results, none: results.length === 0,\n      monthLabels: ['J','F','M','A','M','J','J','A','S','O','N','D'],\n      heat: rows.map(([name, s]) => ({ name, cells: s.split('').map(k => 'height: 36px; border-radius: 6px; background: ' + lv[k]) })),\n      ess: [\n        { t: 'Money', d: 'Carry cash for villages and remote areas; ATMs thin out beyond towns.' },\n        { t: 'Mobile network', d: 'Patchy in high passes and remote valleys. Download offline maps.' },\n        { t: 'Health', d: 'Altitude above 3,000 m in Tawang and North Sikkim — acclimatise slowly.' },\n        { t: 'Packing', d: 'Rain shell year-round, layers for the hills, grippy shoes for treks.' },\n        { t: 'Etiquette', d: 'Ask before photographing people; dress modestly at monasteries.' },\n        { t: 'Carry ID', d: 'Keep printed permits and photo ID handy for checkposts.' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
    </script>
