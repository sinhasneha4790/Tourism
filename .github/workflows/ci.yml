name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mistrail
          POSTGRES_PASSWORD: mistrail
          POSTGRES_DB: mistrail_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mistrail" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Test-only values. AUTH_TEST_LOGIN is refused on Vercel, so it can never reach production.
      DATABASE_URL: postgres://mistrail:mistrail@localhost:5432/mistrail_test
      AUTH_SECRET: ci-test-secret-not-for-production-0123456789
      AUTH_TEST_LOGIN: '1'
      ADMIN_EMAILS: admin@mistrail.test
      # Local fake payment gateway (refused on Vercel); exercises the real signature checks.
      PAYMENTS_FAKE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run validate:content
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run db:migrate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
